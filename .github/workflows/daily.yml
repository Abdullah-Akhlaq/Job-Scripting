name: Daily Job Hunt 🔍

on:
  schedule:
    # 8 AM German time
    # CEST (summer, UTC+2): 6:00 UTC
    # CET (winter, UTC+1): 7:00 UTC
    # GitHub automatically switches - using 6:00 for CEST
    - cron: '0 6 * * *'
  
  # Allows manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore the seen_jobs.json database from cache
      # This ensures we track jobs across workflow runs
      - name: 💾 Restore job tracking database
        uses: actions/cache@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_number }}
          restore-keys: |
            seen-jobs-

      - name: 🔍 Run job scraper
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "=== Job Hunt Started ==="
          echo "Time: $(date)"
          echo "Python version: $(python --version)"
          python -u main.py
          echo "=== Job Hunt Completed ==="

      # Save the updated job database for next run
      - name: 💾 Save job tracking database
        uses: actions/cache@v4
        if: always()
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_number }}

      - name: 📊 Workflow summary
        if: always()
        run: |
          echo "Workflow completed successfully!"
          echo "Next run: Tomorrow at 8 AM German time"
          if [ -f seen_jobs.json ]; then
            echo "Tracked jobs in database: $(grep -o '"link"' seen_jobs.json | wc -l)"
          fi
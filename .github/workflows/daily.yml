name: Daily Job Hunt 🔍

on:
  schedule:
    - cron: '0 6 * * *'         # 8 AM Germany time (CEST - Summer)
  workflow_dispatch:            # Allows manual testing

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restores seen_jobs.json from previous runs if it exists
      - name: Restore Cache for seen_jobs DB
        uses: actions/cache@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Run Job Hunter
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u main.py
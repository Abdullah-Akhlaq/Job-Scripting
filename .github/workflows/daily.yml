name: Daily Job Hunt

on:
  schedule:
    - cron: '0 7 * * *'  # 7 AM UTC = 8 AM Germany (CET) / 9 AM CEST in summer
  workflow_dispatch:       # manual trigger for testing

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install feedparser requests beautifulsoup4

      - name: Run job hunter
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save DB
        uses: actions/upload-artifact@v4       # ✅ updated from v3 → v4
        with:
          name: jobs-db
          path: jobs.db
          retention-days: 1                    # keep it lean, only need latest